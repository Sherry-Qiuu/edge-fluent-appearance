<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aurora ribbons in teal and violet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04171d"/>
      <stop offset=".46" stop-color="#082b34"/>
      <stop offset="1" stop-color="#15122e"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19c6a8" stop-opacity="0"/>
      <stop offset=".28" stop-color="#2de0c0" stop-opacity=".92"/>
      <stop offset=".66" stop-color="#6ee7d2" stop-opacity=".78"/>
      <stop offset="1" stop-color="#9d8cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset=".36" stop-color="#8b6cff" stop-opacity=".62"/>
      <stop offset=".7" stop-color="#38bdf8" stop-opacity=".52"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2de0c0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2de0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="300" cy="310" rx="470" ry="360" fill="url(#glowA)" filter="url(#softer)"/>
  <ellipse cx="1180" cy="220" rx="430" ry="330" fill="url(#glowB)" filter="url(#softer)"/>
  <ellipse cx="820" cy="900" rx="500" ry="280" fill="#0ea5e9" opacity=".16" filter="url(#softer)"/>
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M-120 760C190 520 410 690 680 500S1190 160 1740 300" stroke="url(#ribbonA)" stroke-width="150" opacity=".8"/>
    <path d="M-80 420C260 620 480 330 800 430S1280 760 1710 590" stroke="url(#ribbonB)" stroke-width="96" opacity=".72"/>
    <path d="M-60 890C260 650 560 830 840 690S1330 420 1690 470" stroke="url(#ribbonA)" stroke-width="58" opacity=".55"/>
  </g>
  <g fill="none" stroke-linecap="round" opacity=".8">
    <path d="M-100 770C210 530 430 700 700 510S1200 175 1730 310" stroke="#b9fff2" stroke-width="7" filter="url(#soft)"/>
    <path d="M-80 430C270 630 490 340 810 440S1290 770 1700 600" stroke="#d6c9ff" stroke-width="5" filter="url(#soft)"/>
  </g>
  <g fill="#dffcf6">
    <circle cx="220" cy="180" r="2.4" opacity=".7"/>
    <circle cx="470" cy="120" r="1.9" opacity=".5"/>
    <circle cx="890" cy="150" r="2.2" opacity=".65"/>
    <circle cx="1310" cy="120" r="1.6" opacity=".45"/>
    <circle cx="1450" cy="330" r="2.6" opacity=".6"/>
    <circle cx="1120" cy="90" r="1.4" opacity=".4"/>
    <circle cx="650" cy="240" r="1.6" opacity=".35"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
