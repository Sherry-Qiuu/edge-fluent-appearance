<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Snowy alpine peaks reflected in a still lake">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2ec"/>
      <stop offset=".52" stop-color="#e8f0f3"/>
      <stop offset="1" stop-color="#b9d0da"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa6b6"/>
      <stop offset=".55" stop-color="#4f788b"/>
      <stop offset="1" stop-color="#28485a"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbfd"/>
      <stop offset=".5" stop-color="#c7dbe4"/>
      <stop offset="1" stop-color="#6f8d9d"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#527181"/>
      <stop offset="1" stop-color="#2f4b5b"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7e2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff7e2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="240" r="190" fill="url(#sun)" filter="url(#soft)"/>
  <path d="M0 560 180 470 300 520 470 350 610 480 760 390 930 545 1080 430 1240 520 1400 410 1600 520v90H0Z" fill="#9ab3c0" opacity=".65"/>
  <path d="M0 650 210 500 360 590 560 320 760 540 900 470 1060 590 1230 380 1400 530 1600 470v160H0Z" fill="url(#ridge)"/>
  <path d="M560 320 620 420 575 410 640 520 560 500 500 540 470 470 515 455Z" fill="url(#peak)"/>
  <path d="M1230 380 1280 470 1240 458 1290 545 1220 520 1170 550 1140 490 1190 470Z" fill="#e9f3f6" opacity=".92"/>
  <path d="M760 540 810 470 860 540 820 530 790 570Z" fill="#dceaf0" opacity=".55"/>
  <rect y="610" width="1600" height="390" fill="url(#lake)"/>
  <g fill="none" stroke-linecap="round" opacity=".4">
    <path d="M0 700c240-28 410 20 620-6s390-36 590-8 300 18 390 6" stroke="#d8edf2" stroke-width="2"/>
    <path d="M0 760c260-22 430 18 650-8s370-28 560-10 290 14 390 2" stroke="#a9ccd8" stroke-width="1.6"/>
    <path d="M0 840c220-18 400 12 610-4s420-22 610-4 250 8 380-2" stroke="#8bb7c5" stroke-width="1.2"/>
  </g>
  <path d="M560 610 620 700 575 690 640 790 560 760 500 800 470 720 515 705Z" fill="#d7e8ee" opacity=".14" filter="url(#soft)"/>
  <path d="M1230 610 1280 700 1240 690 1290 790 1220 760 1170 800 1140 720 1190 705Z" fill="#d7e8ee" opacity=".12" filter="url(#soft)"/>
  <g fill="#f4fbfd" opacity=".5">
    <circle cx="280" cy="240" r="1.8"/>
    <circle cx="520" cy="180" r="1.2"/>
    <circle cx="900" cy="210" r="1.5"/>
    <circle cx="1420" cy="180" r="1.6"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".65"/>
</svg>
