<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Red rock canyon with a winding river under a blue sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec5df"/>
      <stop offset=".55" stop-color="#cfe6eb"/>
      <stop offset="1" stop-color="#f0dcc2"/>
    </linearGradient>
    <linearGradient id="mesaBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d58d5f"/>
      <stop offset="1" stop-color="#9f5e42"/>
    </linearGradient>
    <linearGradient id="mesaMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b76a48"/>
      <stop offset=".6" stop-color="#8b4d38"/>
      <stop offset="1" stop-color="#603329"/>
    </linearGradient>
    <linearGradient id="mesaFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f4a35"/>
      <stop offset="1" stop-color="#4a271f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86cbd1"/>
      <stop offset=".6" stop-color="#3f94a6"/>
      <stop offset="1" stop-color="#1e5d75"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".84" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <path d="M0 520 170 470 300 500 470 380 620 450 780 390 940 480 1110 420 1270 490 1430 440 1600 500v500H0Z" fill="#d8b49b" opacity=".55"/>
  <path d="M0 610 200 500 380 560 540 430 720 520 900 450 1080 560 1260 480 1440 560 1600 520v480H0Z" fill="url(#mesaBack)"/>
  <path d="M0 720 160 610 320 680 500 560 660 650 840 580 1020 690 1200 600 1380 700 1600 640v360H0Z" fill="url(#mesaMid)"/>
  <path d="M0 910 200 760 380 840 560 720 740 830 920 760 1100 870 1280 780 1460 900 1600 850v150H0Z" fill="url(#mesaFront)"/>
  <path d="M700 1000c80-130 60-230 190-320 100-70 180-90 300-150 90-44 160-110 220-190" fill="none" stroke="url(#river)" stroke-width="76" stroke-linecap="round" opacity=".9"/>
  <path d="M710 990c78-125 62-225 185-310 95-65 175-85 290-145 86-42 155-105 215-180" fill="none" stroke="#c8f1ee" stroke-width="7" stroke-linecap="round" opacity=".45" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round" opacity=".38">
    <path d="M40 780c120-50 220-20 330-60" stroke="#f2c09f" stroke-width="2"/>
    <path d="M1000 760c120-40 210-20 300-50" stroke="#f2c09f" stroke-width="1.6"/>
    <path d="M180 900c100-30 190-20 270-40" stroke="#e9ae8a" stroke-width="1.4"/>
  </g>
  <g fill="#fff4df" opacity=".55">
    <circle cx="300" cy="220" r="1.5"/><circle cx="640" cy="160" r="1.2"/>
    <circle cx="980" cy="200" r="1.6"/><circle cx="1330" cy="250" r="1.3"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".65"/>
</svg>
