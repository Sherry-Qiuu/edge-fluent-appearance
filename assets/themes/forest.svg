<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Misty pine forest with soft shafts of morning light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce8d8"/>
      <stop offset=".38" stop-color="#8fae91"/>
      <stop offset=".72" stop-color="#315a43"/>
      <stop offset="1" stop-color="#102b22"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4e9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#eef4e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9d9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff9d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="470" cy="280" rx="380" ry="230" fill="url(#fog)" filter="url(#soft)"/>
  <g opacity=".28" filter="url(#soft)">
    <path d="M150 0 520 900H-80Z" fill="url(#ray)"/>
    <path d="M520 0 920 900H250Z" fill="url(#ray)"/>
    <path d="M890 0 1310 900H680Z" fill="url(#ray)"/>
  </g>
  <g fill="#214b37" opacity=".38">
    <path d="M80 900 130 680 180 900Z"/><path d="M220 900 300 620 380 900Z"/>
    <path d="M1310 900 1370 650 1430 900Z"/><path d="M1450 900 1520 690 1590 900Z"/>
  </g>
  <g fill="#173a2c" opacity=".62">
    <path d="M-40 930 70 560 180 930Z"/><path d="M150 940 260 500 370 940Z"/>
    <path d="M340 940 430 600 520 940Z"/><path d="M1120 940 1220 550 1320 940Z"/>
    <path d="M1280 950 1380 520 1480 950Z"/><path d="M1460 950 1550 610 1640 950Z"/>
  </g>
  <g fill="#0b241c">
    <path d="M-60 1000 40 620 140 1000Z"/><path d="M90 1000 210 530 330 1000Z"/>
    <path d="M280 1000 380 660 480 1000Z"/><path d="M420 1000 520 590 620 1000Z"/>
    <path d="M1050 1000 1160 560 1270 1000Z"/><path d="M1220 1000 1330 620 1440 1000Z"/>
    <path d="M1400 1000 1500 540 1600 1000Z"/>
  </g>
  <g fill="none" stroke="#d7e5d5" stroke-linecap="round" opacity=".3">
    <path d="M180 680c80-30 130-30 210 0" stroke-width="1.6"/>
    <path d="M700 740c90-28 150-28 240 0" stroke-width="1.3"/>
    <path d="M980 660c70-22 120-22 190 0" stroke-width="1.1"/>
  </g>
  <g fill="#f4f7e8" opacity=".5">
    <circle cx="360" cy="260" r="1.6"/><circle cx="680" cy="190" r="1.2"/>
    <circle cx="980" cy="240" r="1.8"/><circle cx="1260" cy="160" r="1.3"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
