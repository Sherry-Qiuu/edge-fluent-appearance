<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Night sky over mountain ridges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset=".55" stop-color="#0a0d23"/>
      <stop offset="1" stop-color="#14102b"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4f46e5" stop-opacity=".48"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".32"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#c7d2fe" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="ridgeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#111326"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="74"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="420" cy="300" rx="560" ry="360" fill="url(#nebulaA)" filter="url(#blur)"/>
  <ellipse cx="1240" cy="210" rx="420" ry="300" fill="url(#nebulaB)" filter="url(#blur)"/>
  <circle cx="1210" cy="230" r="130" fill="url(#moon)" filter="url(#blur)"/>
  <circle cx="1210" cy="230" r="34" fill="#eef2ff" opacity=".8"/>
  <path d="M0 780L180 640 320 700 520 560 700 690 880 590 1080 720 1260 610 1430 700 1600 620v380H0Z" fill="url(#ridgeA)" opacity=".9"/>
  <path d="M0 880L220 740 390 810 610 690 790 800 990 720 1190 820 1370 740 1600 820v180H0Z" fill="url(#ridgeB)"/>
  <g fill="#e0e7ff">
    <circle cx="180" cy="150" r="2.2" opacity=".8"/>
    <circle cx="320" cy="240" r="1.4" opacity=".5"/>
    <circle cx="520" cy="110" r="1.8" opacity=".65"/>
    <circle cx="700" cy="190" r="1.2" opacity=".4"/>
    <circle cx="860" cy="130" r="2" opacity=".6"/>
    <circle cx="1040" cy="90" r="1.5" opacity=".55"/>
    <circle cx="1380" cy="160" r="2.4" opacity=".75"/>
    <circle cx="1500" cy="280" r="1.3" opacity=".45"/>
    <circle cx="960" cy="300" r="1.1" opacity=".35"/>
    <circle cx="640" cy="330" r="1.6" opacity=".45"/>
    <circle cx="240" cy="420" r="1.2" opacity=".32"/>
    <circle cx="1460" cy="430" r="1.4" opacity=".38"/>
  </g>
  <g fill="none" stroke="#a5b4fc" opacity=".18">
    <path d="M0 520C300 450 560 540 860 470S1320 380 1600 480" stroke-width="1.2"/>
    <path d="M0 560C300 490 560 580 860 510S1320 420 1600 520" stroke-width=".8"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
