<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep blue ocean waves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02111f"/>
      <stop offset=".48" stop-color="#042c40"/>
      <stop offset="1" stop-color="#07546a"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0"/>
      <stop offset=".28" stop-color="#0891b2" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#155e75" stop-opacity="0"/>
      <stop offset=".42" stop-color="#2dd4bf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1120" cy="190" rx="520" ry="300" fill="url(#glow)" filter="url(#softer)"/>
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M-160 600C140 430 430 690 760 520S1280 300 1780 440" stroke="url(#waveA)" stroke-width="130" opacity=".75"/>
    <path d="M-120 760C210 570 500 830 840 650S1330 470 1760 560" stroke="url(#waveB)" stroke-width="86" opacity=".62"/>
    <path d="M-100 390C230 540 500 300 820 390S1310 620 1740 420" stroke="url(#waveA)" stroke-width="42" opacity=".38"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M-120 630C160 480 430 720 760 555S1290 340 1760 470" stroke="#cffafe" stroke-width="5" opacity=".7" filter="url(#soft)"/>
    <path d="M-100 790C210 610 500 860 840 685S1330 505 1750 590" stroke="#a5f3fc" stroke-width="3" opacity=".5"/>
  </g>
  <g fill="#e0fbff">
    <circle cx="300" cy="250" r="1.8" opacity=".5"/>
    <circle cx="620" cy="180" r="1.3" opacity=".4"/>
    <circle cx="980" cy="240" r="2" opacity=".55"/>
    <circle cx="1380" cy="150" r="1.5" opacity=".4"/>
    <circle cx="1500" cy="310" r="2.2" opacity=".45"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".7"/>
</svg>
