<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Turquoise coastline with cliffs and evening surf">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d8c2"/>
      <stop offset=".45" stop-color="#eeb99b"/>
      <stop offset="1" stop-color="#b7d6d6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c7c4"/>
      <stop offset=".5" stop-color="#2c8f9b"/>
      <stop offset="1" stop-color="#0d4b62"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a3d"/>
      <stop offset=".55" stop-color="#3f2d2a"/>
      <stop offset="1" stop-color="#1b1c20"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d3ae"/>
      <stop offset="1" stop-color="#c7976f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1180" cy="180" r="120" fill="#ffe9cf" opacity=".55" filter="url(#soft)"/>
  <path d="M0 560C260 520 430 580 650 545s370-70 560-35 270 60 390 30v460H0Z" fill="url(#sea)"/>
  <g fill="none" stroke-linecap="round" opacity=".5">
    <path d="M430 660c190-40 330 20 520-10s290-25 440-4" stroke="#d9f4ee" stroke-width="4" filter="url(#soft)"/>
    <path d="M590 730c170-28 290 16 450-8s250-18 380-2" stroke="#b5e9e4" stroke-width="3"/>
    <path d="M760 810c140-22 250 12 380-6s220-14 340 0" stroke="#8fd6d6" stroke-width="2"/>
  </g>
  <path d="M0 430 180 400 300 470 420 420 560 500 640 620 510 760 360 860 180 900 0 860Z" fill="url(#cliff)"/>
  <path d="M0 860 200 790 350 820 480 760 600 800 720 900 540 1000H0Z" fill="url(#sand)" opacity=".92"/>
  <path d="M0 900c160-60 280-30 430-80s260 0 380-20" fill="none" stroke="#f6e6c8" stroke-width="12" opacity=".6" filter="url(#soft)"/>
  <g fill="#f8efe0" opacity=".7">
    <circle cx="760" cy="560" r="2"/><circle cx="960" cy="590" r="1.5"/>
    <circle cx="1140" cy="550" r="1.8"/><circle cx="1310" cy="600" r="1.3"/>
    <circle cx="860" cy="650" r="1.2"/><circle cx="1050" cy="680" r="1.5"/>
  </g>
  <g fill="#1c2d2c" opacity=".55">
    <path d="M300 510c50-30 100-20 130 20-40 10-90 10-130-20Z"/>
    <path d="M180 560c40-18 80-12 100 12-35 8-70 6-100-12Z"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".65"/>
</svg>
